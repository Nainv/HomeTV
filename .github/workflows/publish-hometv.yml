name: Publish signed Home TV update

on:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/publish-hometv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hometv-pages
  cancel-in-progress: false

jobs:
  signing-secrets:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Add the four Android signing Actions secrets to enable signed publishing."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: signing-secrets
    if: needs.signing-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      version_code: ${{ steps.version.outputs.code }}
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - name: Check out Home TV
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1

      - name: Generate version
        id: version
        shell: bash
        run: |
          echo "code=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=3.7.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Decode and verify signing key
        id: keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/zikra-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Build signed Home TV APKs
        working-directory: launcher
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintStandardPublish lintFireOs6Publish \
            -PhomeVersionCode=${{ steps.version.outputs.code }} \
            -PhomeVersionName=${{ steps.version.outputs.name }} || {
            find app/build -name 'lint-results-*.txt' -exec cat {} \\;
            exit 1
          }
          ./gradlew --no-daemon assembleStandardPublish assembleFireOs6Publish \
            -PhomeVersionCode=${{ steps.version.outputs.code }} \
            -PhomeVersionName=${{ steps.version.outputs.name }}

      - name: Verify signatures and prepare update files
        shell: bash
        env:
          HOME_VERSION_CODE: ${{ steps.version.outputs.code }}
          HOME_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          STANDARD_APK="$(find launcher/app/build/outputs/apk/standard/publish -type f -name '*.apk' | head -n 1)"
          FIREOS6_APK="$(find launcher/app/build/outputs/apk/fireOs6/publish -type f -name '*.apk' | head -n 1)"
          test -s "$STANDARD_APK"
          test -s "$FIREOS6_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$STANDARD_APK" | tee "$RUNNER_TEMP/home-tv-standard-signature.txt"
          "$APKSIGNER" verify --verbose --print-certs "$FIREOS6_APK" | tee "$RUNNER_TEMP/home-tv-fireos6-signature.txt"
          STANDARD_APK="$STANDARD_APK" FIREOS6_APK="$FIREOS6_APK" python3 - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path
          expected = "d73500da98b7280d7906d3fa828d1857088ff811c623e385e1213ada4f03d4ce"
          for name in ("standard", "fireos6"):
              report = (Path(os.environ["RUNNER_TEMP"]) / f"home-tv-{name}-signature.txt").read_text().lower()
              found = re.findall(r"certificate sha-256 digest: ([0-9a-f]{64})", report)
              if not found or set(found) != {expected}:
                  raise SystemExit(f"{name} APK signer does not match the verified Zikra signing certificate.")
          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          shutil.copyfile(os.environ["STANDARD_APK"], dist / "tv.apk")
          shutil.copyfile(os.environ["FIREOS6_APK"], dist / "tv-fireos6.apk")
          manifest = {
              "versionName": os.environ["HOME_VERSION_NAME"],
              "versionCode": int(os.environ["HOME_VERSION_CODE"]),
              "url": "https://nainv.github.io/HomeTV/tv.apk",
              "sha256": hashlib.sha256((dist / "tv.apk").read_bytes()).hexdigest(),
              "fireOs6VersionName": os.environ["HOME_VERSION_NAME"],
              "fireOs6VersionCode": int(os.environ["HOME_VERSION_CODE"]),
              "fireOs6Url": "https://nainv.github.io/HomeTV/tv-fireos6.apk",
              "fireOs6Sha256": hashlib.sha256((dist / "tv-fireos6.apk").read_bytes()).hexdigest(),
          }
          (dist / "release.json").write_text(json.dumps(manifest), encoding="utf-8")
          (dist / ".nojekyll").write_text("", encoding="utf-8")
          print(f"Prepared standard and Fire OS 6 Home TV {manifest['versionName']} ({manifest['versionCode']}).")
          PY

      - name: Publish versioned GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          gh release create "v$HOME_VERSION_NAME" dist/tv.apk dist/tv-fireos6.apk \
            --title "Home TV $HOME_VERSION_NAME" \
            --notes "Home TV signed updates. Stable downloads: standard https://github.com/Nainv/HomeTV/releases/latest/download/tv.apk ; Fire OS 6 (Android 7.1) https://github.com/Nainv/HomeTV/releases/latest/download/tv-fireos6.apk"

      - name: Upload Pages files
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist

  deploy:
    needs: [signing-secrets, build]
    if: needs.signing-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read
      contents: read
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Publish Home TV update files
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
