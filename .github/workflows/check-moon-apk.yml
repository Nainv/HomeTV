name: Verify Moon APK identity
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/check-moon-apk.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: build-tools;34.0.0
      - name: Read signed APK metadata
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --retry 2 'https://github.com/Nainv/HomeTV/releases/download/Moon/Moon.Pro.-.v3.8.apk
          echo '57a5685e775fc6d5da629162b875b82e8e9c5e2dcd1e77c9b87cfeafae4f47fd  moon.apk' | sha256sum -c -
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging moon.apk > moon-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          for line in Path('moon-badging.txt').read_text().splitlines():
              if line.startswith(('package:', 'application-label:', 'launchable-activity:', 'sdkVersion:', 'targetSdkVersion:')):
                  print(line)
          PY
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs moon.apk
