name: Build signed Home TV add-on catalog

on:
  workflow_dispatch:
  push:
    branches: [cards-language]
    paths:
      - '.github/workflows/publish-addons.yml'
      - 'addons/**'
      - 'launcher/app/src/main/assets/addons/catalog.json'

permissions:
  contents: write

concurrency:
  group: hometv-addon-catalog
  cancel-in-progress: false

jobs:
  build:
    name: Add-on ${{ matrix.addon }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        addon: [tv-hub, weather, world-clock, prayer-times, photo-screensaver, news-screensaver, frigate-glance, photo-prints, ad-blocking, airplay-status, bluetooth-connect, brightness, capacity-stats, digital-rain, flock, headphones, jewish-calendar, quiet-hours, remote-access, sleep-timer, smart-home, sources, startup-branding, tv-static]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Configure stable signing without source-tree keys
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/addon-release.jks"
          cat > "$RUNNER_TEMP/addon-signing.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              p.pluginManager.withPlugin('com.android.application') {
                  p.extensions.getByName('androidComponents').finalizeDsl { android ->
                      def signed = android.signingConfigs.create('homeAddon')
                      signed.storeFile = new File(System.getenv('RUNNER_TEMP'), 'addon-release.jks')
                      signed.storePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      signed.keyAlias = System.getenv('ANDROID_KEY_ALIAS')
                      signed.keyPassword = System.getenv('ANDROID_KEY_PASSWORD')
                      android.buildTypes.getByName('release').signingConfig = signed
                      android.defaultConfig.versionCode = 1000000 + Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER'))
                  }
              }
          }
          GRADLE
      - name: Build and run add-on unit tests
        working-directory: addons/${{ matrix.addon }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --init-script "$RUNNER_TEMP/addon-signing.gradle" testReleaseUnitTest assembleRelease
      - name: Verify package, SDK and pinned signer; publish selected asset
        env:
          ADDON_ID: ${{ matrix.addon }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="addons/$ADDON_ID/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/signer.txt"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          addon=os.environ['ADDON_ID']
          entry=next(x for x in json.loads(Path('launcher/app/src/main/assets/addons/catalog.json').read_text()) if x['id']==addon)
          temp=Path(os.environ['RUNNER_TEMP']);badging=(temp/'badging.txt').read_text()
          assert re.search(r"package: name='([^']+)'",badging).group(1)==entry['packageName']
          assert int(re.search(r"sdkVersion:'(\d+)'",badging).group(1))==entry['minSdk']
          assert int(re.search(r"versionCode='(\d+)'",badging).group(1))==1000000+int(os.environ['GITHUB_RUN_NUMBER'])
          certificates=re.findall(r'certificate SHA-256 digest: ([0-9a-f]{64})',(temp/'signer.txt').read_text())
          assert certificates and set(certificates)=={'d73500da98b7280d7906d3fa828d1857088ff811c623e385e1213ada4f03d4ce'}
          PY
          cp "$APK" "$RUNNER_TEMP/home-addon-$ADDON_ID.apk"
          gh release upload v3.7.9 "$RUNNER_TEMP/home-addon-$ADDON_ID.apk" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/addon-release.jks" "$RUNNER_TEMP/addon-signing.gradle"
